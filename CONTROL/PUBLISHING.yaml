# Стоп-кран публикаций POST-HUB (CONTROL/TOOLS/publish.py).
# pause: true — все публикации по расписанию останавливаются (проверка --dry-run продолжает работать);
# один утверждённый пост по команде пользователя («публикуй») выходит вручную: publish.py --post <папка>.
# Решение пользователя 11.10.2026: «пока я всё не утвержу, ничего не запускаешь». Пауза снимается только после
# прямого «утверждаю» пользователя в чате; агент сам паузу не снимает и неутверждённое в READY не переносит.
pause: true
# Сети, которые выходят по расписанию и во время паузы (их очередь уже утверждена).
# Решение пользователя 13.10.2026: «Телеграмм по расписанию — да» — Telegram Aura и GTT с 01.11.2026 (09:00 и 18:00 МСК).
pause_except: [TELEGRAM]
# Утверждённые посты, которые выходят по расписанию и во время паузы (папки в READY; вышедшие уезжают в PUBLISHED сами).
# Решение пользователя 14.10.2026, ~05:35 МСК: «Отлично! утверждаю» — 6 публикаций дня в Instagram + их дубли в Facebook.
# Остальная очередь (в т.ч. посты Facebook с 03.11) — на паузе до отдельного «утверждаю».
pause_allow:
  - AURA/INSTAGRAM/REELS/READY/2026-10-14_0730_matrix-1-reels
  - AURA/FACEBOOK/REELS/READY/2026-10-14_0730_matrix-1-reels
  - GTT/INSTAGRAM/REELS/READY/2026-10-14_0800_tech-giganty
  - GTT/FACEBOOK/REELS/READY/2026-10-14_0800_tech-giganty
  - AURA/INSTAGRAM/STORIES/READY/2026-10-14_1100_anons-matrix-1
  - AURA/FACEBOOK/STORIES/READY/2026-10-14_1100_anons-matrix-1
  - GTT/INSTAGRAM/CAROUSEL/READY/2026-10-14_1300_tur-china-tech-giants
  - GTT/FACEBOOK/POST/READY/2026-10-14_1300_tur-china-tech-giants
  - GTT/INSTAGRAM/STORIES/READY/2026-10-14_1300_tech-giganty
  - GTT/FACEBOOK/STORIES/READY/2026-10-14_1300_tech-giganty
  - AURA/INSTAGRAM/CAROUSEL/READY/2026-10-14_1800_matrix-1
