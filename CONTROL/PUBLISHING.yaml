# Стоп-кран публикаций POST-HUB (CONTROL/TOOLS/publish.py).
# pause: true — все публикации по расписанию останавливаются (проверка --dry-run продолжает работать);
# один утверждённый пост по команде пользователя («публикуй») выходит вручную: publish.py --post <папка>.
# Решение пользователя 11.10.2026: «пока я всё не утвержу, ничего не запускаешь». Пауза снимается только после
# прямого «утверждаю» пользователя в чате; агент сам паузу не снимает и неутверждённое в READY не переносит.
pause: true
# Сети, которые выходят по расписанию и во время паузы (их очередь уже утверждена).
# Решение пользователя 13.10.2026: «Телеграмм по расписанию — да» — Telegram Aura и GTT с 01.11.2026 (09:00 и 18:00 МСК).
# Решение пользователя 15.10.2026: блог ostapdotcenko.ru — «сделай публикацию сейчас и публикуй каждый день в 9 утра по Китаю»
# (пул OSTAPDOTCENKO/BLOG/READY, 04:00 МСК, CONTROL/TOOLS/blog_od.py --due).
pause_except: [TELEGRAM, OSTAPDOTCENKO/BLOG]
