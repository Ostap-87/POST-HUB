# Учёт блогов globaltechtour.ru и aura-robotics.ru (решение пользователя 07.11.2026: «сделай так, чтобы статьи
# самостоятельно выходили без твоего участия»). Сами статьи публикует workflow «Блог из POST-HUB» в репозиториях
# сайтов (Ostap-87/SINOTECH, Ostap-87/AURA) — он читает эту очередь (репозиторий публичный) и пушит статью в сайт.
# Здесь — только учёт: статья, чей slug уже есть в репозитории сайта на GitHub, переезжает
# <ПРОЕКТ>/BLOG/READY → <ПРОЕКТ>/BLOG/PUBLISHED/ГГГГ-ММ/ с info.json (CONTROL/TOOLS/blog_site.py --sync).
name: Блоги сайтов — учёт

on:
  schedule:
    - cron: "*/20 * * * *"   # учёт каждые 20 минут — вслед за публикацией на сайтах
  workflow_dispatch:

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

permissions:
  contents: write

concurrency:
  group: blog-sites-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: READY → PUBLISHED для вышедших статей
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q --depth=1 origin main
            git reset -q --hard origin/main
            python3 CONTROL/TOOLS/blog_site.py --project GTT --sync
            python3 CONTROL/TOOLS/blog_site.py --project AURA --sync
            git add -A GTT/BLOG AURA/BLOG
            if git diff --cached --quiet; then echo "нечего переносить"; exit 0; fi
            # что именно переехало — для уведомления
            MOVED=$(git diff --cached --name-only | grep "/PUBLISHED/" | awk -F/ '{print $1 "|" $(NF-1)}' | sort -u)
            git commit -q -m "Блоги GTT и Aura: вышедшие статьи — в PUBLISHED"
            if git push -q origin HEAD:main; then
              MSG="📚 <b>Статьи вышли на сайтах</b>%0A"
              while IFS='|' read -r PROJ ITEM; do
                [ -z "$PROJ" ] && continue
                SLUG=$(echo "$ITEM" | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{4}_//')
                case "$PROJ" in
                  GTT)  BASE="https://globaltechtour.ru/blog" ;;
                  AURA) BASE="https://aura-robotics.ru/blog" ;;
                  *)    BASE="" ;;
                esac
                MSG="$MSG%0A• $PROJ — <a href=\"$BASE/$SLUG/\">$SLUG</a>"
              done <<< "$MOVED"
              python3 CONTROL/TOOLS/notify.py "$MSG" || true
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
