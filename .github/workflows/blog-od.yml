# Блог ostapdotcenko.ru — ДЕЖУРНЫЙ РЕЖИМ (без cron-поллинга).
# Один прогон живёт ~5 ч 40 мин, раз в минуту проверяет очередь, публикует в 04:00 МСК
# и в конце запускает следующего себя через workflow_dispatch. Планировщик GitHub
# в цепочке не участвует. Ручной запуск без window — разовая публикация просроченного.
name: Блог ostapdotcenko

on:
  workflow_dispatch:
    inputs:
      window:
        description: "Секунд дежурства (пусто — разовая публикация)"
        required: false
        default: ""
      post:
        description: "Одна статья сейчас: папка в OSTAPDOTCENKO/BLOG/READY"
        required: false
        default: ""
      dry_run:
        description: "Только показать, что вышло бы"
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: blog-od-duty
  cancel-in-progress: false

env:
  EVENT: ${{ github.event_name }}
  INPUT_WINDOW: ${{ inputs.window }}
  INPUT_POST: ${{ inputs.post }}
  INPUT_DRY: ${{ inputs.dry_run }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  duty:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.window != '') && 355 || 20 }}
    steps:
      - name: Проверка секрета
        run: |
          if [ -z "${{ secrets.SITE_TOKEN }}" ]; then
            echo "::error::Нет секрета SITE_TOKEN -- публикация невозможна"
            exit 1
          fi

      - name: POST-HUB
        uses: actions/checkout@v4
        with:
          path: hub
          fetch-depth: 1

      - name: Сайт ostapdotcenko
        uses: actions/checkout@v4
        with:
          repository: Ostap-87/ostapdotcenko
          token: ${{ secrets.SITE_TOKEN }}
          path: site
          fetch-depth: 1

      - name: Публикация
        id: pub
        run: |
          set -u
          cd hub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd ../site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd ../hub

          run_publish() {
            BEFORE=$(git -C ../site rev-parse HEAD)
            if [ -n "$INPUT_POST" ]; then
              python3 CONTROL/TOOLS/blog_od.py --post "$INPUT_POST" --site ../site || echo "не удалось, повтор"
            elif [ "$INPUT_DRY" = "true" ]; then
              python3 CONTROL/TOOLS/blog_od.py --due --site ../site --dry-run || true
            else
              python3 CONTROL/TOOLS/blog_od.py --due --site ../site || echo "не удалось, повтор"
            fi
            AFTER=$(git -C ../site rev-parse HEAD)
            if [ "$BEFORE" != "$AFTER" ]; then
              SLUG=$(git -C ../site log -1 --pretty=%s | sed -E 's/^[^:]*: //; s/ \(POST-HUB\)$//')
              python3 CONTROL/TOOLS/notify.py "Новая статья в личном блоге: https://ostapdotcenko.ru/blog/$SLUG/" || true
            fi
          }

          W="$INPUT_WINDOW"
          if [ -z "$W" ]; then W=0; fi
          if [ "$EVENT" = "schedule" ]; then W=20400; fi
          if [ "$W" -gt 0 ]; then
            echo "duty=1" >> "$GITHUB_OUTPUT"
            END=$(( $(date +%s) + W ))
            while [ "$(date +%s)" -lt "$END" ]; do
              git -C ../hub fetch -q --depth=1 origin main || true
              git -C ../hub reset -q --hard origin/main || true
              run_publish
              sleep 60
            done
          else
            run_publish
          fi

      - name: Передать смену следующему дежурному
        if: ${{ !cancelled() && steps.pub.outputs.duty == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run blog-od.yml --repo "$GITHUB_REPOSITORY" --ref main -f window=20400
